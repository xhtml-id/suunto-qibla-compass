<uiView>
  <div id="suuntoplus">
    <div class="sp-title-bg" style="width:100%;height:18%"></div>
    <div class="sp-t-m p-hc sp-title-text" style="top:6%">{{aboutTitle}}</div>

    <div class="sp-b-m p-hc" style="top:calc(23% - 50%e);">QIBLA COMPASS</div>
    <div class="sp-b-s p-hc cm-mid" style="top:calc(29% - 50%e);">{{versionLabel}} 0.1</div>
    <div class="sp-b-s p-hc" style="top:calc(36% - 50%e);">{{authorLabel}} xhtml.id</div>

    <!-- Scannable link to https://qibla.xhtml.id/ -->
    <img src="qr.png" style="position:absolute;left:33%;top:41.5%;width:34%;height:34%;" />

    <div class="sp-b-s p-hc cm-mid" style="top:calc(80% - 50%e);">{{kaabaLabel}}</div>
    <div class="sp-b-s p-hc f-num" style="top:calc(86% - 50%e);">21.422487, 39.826206</div>

    <!-- Lower button returns to the compass screen -->
    <div class="btn btn-btm">
      <img class="cm-bgc icon" src="hint-btn-bottom.png" />
    </div>

    <userInput>
      <pushButton name="down" onClick="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');" />
    </userInput>
  </div>
</uiView>
