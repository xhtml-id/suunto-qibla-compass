<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="300" rx="16" fill="#ffffff"/>
  <rect x="40" y="24" width="400" height="252" rx="10" fill="#252526"/>
  <text x="58" y="54" font-size="12" fill="#bbbbbb" font-weight="700">▾ SUUNTOPLUS APPS</text>
  <rect x="52" y="66" width="376" height="30" fill="#04395e"/>
  <text x="66" y="86" font-size="14" fill="#ffffff">▾ Qibla Compass</text>
  <rect x="72" y="104" width="340" height="26" fill="#2d2d2d"/><text x="86" y="122" font-size="13" fill="#d4d4d4">Build</text>
  <rect x="72" y="134" width="340" height="30" fill="#0e639c" stroke="#f59e0b" stroke-width="2"/><text x="86" y="154" font-size="13" fill="#ffffff" font-weight="700">Build and Add App to Watch</text>
  <rect x="72" y="168" width="340" height="26" fill="#2d2d2d"/><text x="86" y="186" font-size="13" fill="#d4d4d4">Run in Simulator</text>
  <text x="58" y="226" font-size="12" fill="#bbbbbb" font-weight="700">▾ SUUNTO WATCH</text>
  <text x="72" y="250" font-size="12" fill="#4ade80">● Connected Suunto watch</text>
  <!-- language picker -->
  <rect x="490" y="40" width="430" height="120" rx="8" fill="#252526" stroke="#3c3c3c"/>
  <rect x="490" y="40" width="430" height="32" rx="8" fill="#3c3c3c"/><rect x="490" y="62" width="430" height="10" fill="#3c3c3c"/>
  <text x="504" y="61" font-size="13" fill="#cccccc">Select language</text>
  <rect x="490" y="78" width="430" height="34" fill="#04395e" stroke="#f59e0b" stroke-width="2"/>
  <text x="506" y="100" font-size="14" fill="#ffffff" font-weight="700">en — English (default)</text>
  <text x="506" y="138" font-size="14" fill="#d4d4d4">id — Bahasa Indonesia (optional / opsional)</text>
  <g font-size="14" fill="#374151">
    <text x="490" y="198" font-weight="700" fill="#111827">Click “Build and Add App to Watch”, then pick a language.</text>
    <text x="490" y="222">The editor selects the right display package for Race S.</text>
    <text x="490" y="252" fill="#6b7280">Klik “Build and Add App to Watch”, lalu pilih bahasa.</text>
    <text x="490" y="274" fill="#6b7280">Editor memilih paket layar yang cocok untuk Race S.</text>
  </g>
</svg>
