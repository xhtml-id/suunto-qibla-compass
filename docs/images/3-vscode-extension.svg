<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="360" rx="16" fill="#ffffff"/>
  <!-- window -->
  <rect x="40" y="24" width="880" height="312" rx="10" fill="#1e1e1e"/>
  <rect x="40" y="24" width="880" height="30" rx="10" fill="#323233"/><rect x="40" y="44" width="880" height="10" fill="#323233"/>
  <circle cx="62" cy="39" r="6" fill="#ff5f57"/><circle cx="82" cy="39" r="6" fill="#febc2e"/><circle cx="102" cy="39" r="6" fill="#28c840"/>
  <text x="480" y="44" text-anchor="middle" font-size="13" fill="#cccccc">qibla — Visual Studio Code</text>
  <!-- activity bar -->
  <rect x="40" y="54" width="52" height="282" fill="#333333"/>
  <g fill="#858585"><rect x="56" y="72" width="20" height="20" rx="3"/><rect x="56" y="112" width="20" height="20" rx="3"/><rect x="56" y="152" width="20" height="20" rx="3"/></g>
  <!-- extensions icon highlighted -->
  <rect x="40" y="186" width="3" height="40" fill="#ffffff"/>
  <g fill="#ffffff"><rect x="56" y="196" width="9" height="9"/><rect x="67" y="196" width="9" height="9"/><rect x="56" y="207" width="9" height="9"/><rect x="69" y="190" width="9" height="9" transform="rotate(20 73 194)"/></g>
  <circle cx="66" cy="206" r="24" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="66" y="250" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="700">1</text>
  <!-- sidebar -->
  <rect x="92" y="54" width="330" height="282" fill="#252526"/>
  <text x="108" y="80" font-size="12" fill="#bbbbbb" font-weight="700">EXTENSIONS</text>
  <rect x="108" y="92" width="298" height="28" fill="#3c3c3c" stroke="#f59e0b" stroke-width="2"/>
  <text x="118" y="111" font-size="14" fill="#ffffff">SuuntoPlus Editor</text>
  <text x="414" y="111" font-size="11" fill="#f59e0b" font-weight="700" text-anchor="end">2</text>
  <rect x="100" y="132" width="314" height="70" fill="#04395e"/>
  <rect x="112" y="144" width="44" height="44" rx="6" fill="#e5e7eb"/><text x="134" y="172" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">S+</text>
  <text x="168" y="160" font-size="14" fill="#ffffff" font-weight="700">SuuntoPlus Editor</text>
  <text x="168" y="178" font-size="12" fill="#cccccc">Suunto</text>
  <rect x="340" y="168" width="64" height="24" rx="2" fill="#0e639c"/><text x="372" y="185" text-anchor="middle" font-size="12" fill="#fff">Install</text>
  <text x="396" y="216" font-size="11" fill="#f59e0b" font-weight="700">3</text>
  <!-- after install panels -->
  <text x="108" y="246" font-size="12" fill="#bbbbbb" font-weight="700">After install, the sidebar shows:</text>
  <rect x="108" y="256" width="298" height="24" fill="#2d2d2d"/><text x="118" y="273" font-size="12" fill="#ffffff">▸ SUUNTOPLUS APPS</text>
  <rect x="108" y="286" width="298" height="24" fill="#2d2d2d"/><text x="118" y="303" font-size="12" fill="#ffffff">▸ SUUNTO WATCH</text>
  <!-- editor area text -->
  <text x="450" y="96" font-size="15" fill="#d4d4d4" font-weight="700">1  Open the Extensions view (Ctrl+Shift+X)</text>
  <text x="450" y="126" font-size="15" fill="#d4d4d4" font-weight="700">2  Search “SuuntoPlus Editor”</text>
  <text x="450" y="156" font-size="15" fill="#d4d4d4" font-weight="700">3  Install the extension published by Suunto</text>
  <text x="450" y="186" font-size="15" fill="#d4d4d4" font-weight="700">4  File → Open Folder… → this project folder</text>
  <text x="450" y="232" font-size="13" fill="#9ca3af">Buka Extensions (Ctrl+Shift+X), cari “SuuntoPlus Editor”,</text>
  <text x="450" y="252" font-size="13" fill="#9ca3af">pasang ekstensi resmi dari Suunto, lalu buka folder proyek ini</text>
  <text x="450" y="272" font-size="13" fill="#9ca3af">lewat File → Open Folder…</text>
  <text x="450" y="318" font-size="11" fill="#6b7280">Illustration / Ilustrasi</text>
</svg>
