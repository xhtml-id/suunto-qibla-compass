<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="300" rx="16" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Install order / Urutan pemasangan</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9ca3af"/></marker>
  </defs>
  <g font-size="14" fill="#374151" text-anchor="middle">
    <!-- 1 phone -->
    <rect x="20" y="62" width="168" height="214" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
    <circle cx="44" cy="86" r="14" fill="#4f46e5"/><text x="44" y="91" fill="#fff" font-weight="700">1</text>
    <rect x="79" y="76" width="50" height="90" rx="9" fill="#1f2937"/><rect x="84" y="84" width="40" height="70" rx="3" fill="#e5e7eb"/>
    <text x="104" y="108" font-size="10" fill="#111827" font-weight="700">Kiblat</text>
    <text x="104" y="124" font-size="9" fill="#4b5563">sport mode</text>
    <text x="104" y="192" font-weight="700" fill="#111827">Suunto app</text>
    <text x="104" y="212">Create sport mode</text>
    <text x="104" y="230">“Kiblat”, then sync</text>
    <text x="104" y="254" font-size="12" fill="#6b7280">(optional)</text>
    <!-- 2 forget -->
    <rect x="208" y="62" width="168" height="214" rx="14" fill="#fef2f2" stroke="#fecaca"/>
    <circle cx="232" cy="86" r="14" fill="#dc2626"/><text x="232" y="91" fill="#fff" font-weight="700">2</text>
    <circle cx="292" cy="122" r="40" fill="#111827"/><circle cx="292" cy="122" r="33" fill="#000"/>
    <text x="292" y="118" font-size="9" fill="#fff">MobileApp</text>
    <text x="292" y="134" font-size="10" fill="#f87171" font-weight="700">Forget</text>
    <text x="292" y="192" font-weight="700" fill="#111827">Watch</text>
    <text x="292" y="212">Forget the phone</text>
    <text x="292" y="230">pairing first</text>
    <!-- 3 pc -->
    <rect x="396" y="62" width="168" height="214" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="420" cy="86" r="14" fill="#2563eb"/><text x="420" y="91" fill="#fff" font-weight="700">3</text>
    <rect x="440" y="88" width="80" height="54" rx="4" fill="#1e1e1e"/><rect x="446" y="94" width="14" height="42" fill="#333"/>
    <rect x="466" y="100" width="46" height="5" fill="#3b82f6"/><rect x="466" y="111" width="34" height="5" fill="#6b7280"/><rect x="466" y="122" width="40" height="5" fill="#6b7280"/>
    <rect x="468" y="142" width="24" height="10" fill="#9ca3af"/><rect x="452" y="152" width="56" height="5" rx="2" fill="#9ca3af"/>
    <text x="480" y="192" font-weight="700" fill="#111827">PC</text>
    <text x="480" y="212">VS Code + SuuntoPlus</text>
    <text x="480" y="230">Editor + Bluetooth</text>
    <text x="480" y="248">pairing</text>
    <!-- 4 build -->
    <rect x="584" y="62" width="168" height="214" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
    <circle cx="608" cy="86" r="14" fill="#059669"/><text x="608" y="91" fill="#fff" font-weight="700">4</text>
    <rect x="606" y="104" width="124" height="34" rx="6" fill="#059669"/>
    <text x="668" y="119" font-size="10" fill="#fff" font-weight="700">Build and Add</text>
    <text x="668" y="132" font-size="10" fill="#fff" font-weight="700">App to Watch</text>
    <text x="668" y="160" font-size="12" fill="#065f46">en ✓ · id (optional)</text>
    <text x="668" y="192" font-weight="700" fill="#111827">Install</text>
    <text x="668" y="212">Send the app</text>
    <text x="668" y="230">to the watch</text>
    <!-- 5 watch -->
    <rect x="772" y="62" width="168" height="214" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="796" cy="86" r="14" fill="#ea580c"/><text x="796" y="91" fill="#fff" font-weight="700">5</text>
    <circle cx="856" cy="122" r="40" fill="#111827"/><circle cx="856" cy="122" r="33" fill="#000"/>
    <path d="M856 98 866 132 856 126 846 132Z" fill="#22c55e"/>
    <text x="856" y="192" font-weight="700" fill="#111827">Use outdoors</text>
    <text x="856" y="212">Sport mode →</text>
    <text x="856" y="230">SuuntoPlus →</text>
    <text x="856" y="248">Qibla Compass</text>
  </g>
  <g stroke="#9ca3af" stroke-width="2" marker-end="url(#ar)">
    <line x1="189" y1="169" x2="206" y2="169"/><line x1="377" y1="169" x2="394" y2="169"/>
    <line x1="565" y1="169" x2="582" y2="169"/><line x1="753" y1="169" x2="770" y2="169"/>
  </g>
</svg>
