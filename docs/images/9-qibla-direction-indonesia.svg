<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="400" rx="16" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Qibla direction from Indonesia / Arah kiblat dari Indonesia</text>
  <!-- compass rose centred at 230,215 r=130 -->
  <g transform="translate(230 215)">
    <circle r="130" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <g stroke="#d1d5db"><line y1="-130" y2="130"/><line x1="-130" x2="130"/></g>
    <g font-size="15" font-weight="700" text-anchor="middle">
      <text y="-140" fill="#dc2626">N / U 0°</text><text y="156" fill="#374151">S / 180°</text>
      <text x="166" y="5" fill="#374151">E / T 90°</text><text x="-172" y="5" fill="#374151">W / B 270°</text>
    </g>
    <!-- arc from W (270) to 295 -->
    <path d="M-80 0 A80 80 0 0 1 -72.5 -33.8" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <text x="-62" y="-6" font-size="13" fill="#b45309" font-weight="700">±25°</text>
    <!-- qibla arrow at 295 deg: dx = sin(295)=-0.906, dy=-cos(295)=-0.423 -->
    <line x1="0" y1="0" x2="-114" y2="-53" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
    <path d="M-126 -59 -103 -62 -110 -45Z" fill="#16a34a"/>
    <circle r="7" fill="#111827"/>
    <!-- arc from N clockwise to 295 (dashed) -->
    <path d="M0 -105 A105 105 0 1 1 -95.2 -44.4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="78" y="86" font-size="12" fill="#6b7280">clockwise from true north</text>
    <text x="78" y="102" font-size="11" fill="#9ca3af">searah jarum jam dari utara sejati</text>
  </g>
  <text x="140" y="150" font-size="15" font-weight="700" fill="#16a34a">QIBLA ±295°</text>
  <!-- text right -->
  <g font-size="15" fill="#374151">
    <text x="470" y="80" font-weight="700" fill="#111827">From Indonesia, Qibla is NOT due west (270°).</text>
    <text x="470" y="100" font-size="13" fill="#6b7280">Dari Indonesia, kiblat BUKAN tepat ke barat (270°).</text>
    <text x="470" y="128">It is west-north-west: about <tspan font-weight="700">291°–296°</tspan> from north,</text>
    <text x="470" y="148">depending on the city.</text>
    <text x="470" y="168" font-size="13" fill="#6b7280">Arahnya barat agak ke utara, sekitar 291°–296°, tergantung kota.</text>
    <rect x="470" y="186" width="450" height="124" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="488" y="212" font-weight="700" fill="#166534">Examples (same formula as main.js)</text>
    <text x="488" y="230" font-size="12" fill="#6b7280">Contoh (rumus yang sama dengan main.js)</text>
    <text x="488" y="256">Banda Aceh  292.2°   ·   Jakarta  295.2°</text>
    <text x="488" y="278">Serang  295.3°   ·   Surabaya  294.0°</text>
    <text x="488" y="300">Makassar  292.5°   ·   Jayapura  291.3°</text>
    <text x="470" y="338" font-size="13">1° off in Indonesia ≈ ±138 km off at Makkah (±7,900 km away),</text>
    <text x="470" y="356" font-size="13">so the watch uses GPS instead of one fixed number for all of Indonesia.</text>
    <text x="470" y="378" font-size="12" fill="#6b7280">Meleset 1° di Indonesia ≈ ±138 km di Makkah; karena itu jam memakai GPS.</text>
  </g>
</svg>
