<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="420" rx="16" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Getting coordinates from Google Maps / Mencari koordinat di Google Maps</text>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9ca3af"/></marker></defs>
  <!-- phone 1: long press -->
  <g transform="translate(70 56)">
    <rect width="180" height="320" rx="22" fill="#1f2937"/><rect x="10" y="14" width="160" height="292" rx="10" fill="#e8f0e3"/>
    <path d="M10 120 170 90M10 220 170 250M70 14 110 306" stroke="#ffffff" stroke-width="8"/>
    <rect x="22" y="26" width="136" height="26" rx="13" fill="#ffffff"/><text x="36" y="44" font-size="11" fill="#6b7280">Search here</text>
    <circle cx="90" cy="168" r="26" fill="#2563eb" opacity=".18"/><circle cx="90" cy="168" r="9" fill="#2563eb"/>
    <path d="M90 140c-10 0-17 8-17 17 0 13 17 29 17 29s17-16 17-29c0-9-7-17-17-17z" fill="#ea4335" transform="translate(0 -26)"/>
    <circle cx="90" cy="131" r="6" fill="#fff"/>
  </g>
  <text x="160" y="394" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">1. Long-press the spot</text>
  <text x="160" y="410" text-anchor="middle" font-size="11" fill="#6b7280">Tekan lama titik lokasi</text>
  <!-- phone 2: coordinates in search bar -->
  <g transform="translate(390 56)">
    <rect width="180" height="320" rx="22" fill="#1f2937"/><rect x="10" y="14" width="160" height="292" rx="10" fill="#e8f0e3"/>
    <path d="M10 120 170 90M10 220 170 250M70 14 110 306" stroke="#ffffff" stroke-width="8"/>
    <rect x="18" y="24" width="144" height="30" rx="15" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="90" y="44" text-anchor="middle" font-size="11" fill="#111827" font-weight="700">-6.120100, 106.150300</text>
    <path d="M90 116c-10 0-17 8-17 17 0 13 17 29 17 29s17-16 17-29c0-9-7-17-17-17z" fill="#ea4335"/><circle cx="90" cy="133" r="6" fill="#fff"/>
    <rect x="10" y="226" width="160" height="80" rx="10" fill="#ffffff"/>
    <text x="22" y="250" font-size="12" font-weight="700" fill="#111827">Dropped pin</text>
    <text x="22" y="270" font-size="11" fill="#374151">6°07'12.4"S 106°09'01.1"E</text>
    <text x="22" y="290" font-size="11" fill="#2563eb">Copy</text>
  </g>
  <text x="480" y="394" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">2. Copy the numbers in the search box</text>
  <text x="480" y="410" text-anchor="middle" font-size="11" fill="#6b7280">Salin angka di kotak pencarian</text>
  <!-- result card -->
  <g transform="translate(680 80)" font-size="13" fill="#374151">
    <rect width="250" height="280" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="16" y="28" font-weight="700" fill="#111827">How to read it</text>
    <text x="16" y="44" font-size="11" fill="#6b7280">Cara membaca</text>
    <text x="16" y="72" font-family="Consolas, monospace" fill="#b91c1c">-6.120100</text><text x="104" y="72">= latitude</text>
    <text x="16" y="90" font-size="12">minus = south of the equator</text>
    <text x="16" y="106" font-size="11" fill="#6b7280">minus = Lintang Selatan (LS)</text>
    <text x="16" y="134" font-family="Consolas, monospace" fill="#2563eb">106.150300</text><text x="112" y="134">= longitude</text>
    <text x="16" y="152" font-size="12">positive = east of Greenwich</text>
    <text x="16" y="168" font-size="11" fill="#6b7280">positif = Bujur Timur (BT)</text>
    <line x1="16" y1="184" x2="234" y2="184" stroke="#e5e7eb"/>
    <text x="16" y="206" font-weight="700" fill="#111827">Calculate the Qibla bearing:</text>
    <text x="16" y="222" font-size="11" fill="#6b7280">Hitung arah kiblat:</text>
    <rect x="12" y="232" width="226" height="40" rx="6" fill="#1e1e1e"/>
    <text x="20" y="248" font-family="Consolas, monospace" font-size="10.5" fill="#d4d4d4">node tools/hitung-kiblat.js</text>
    <text x="20" y="264" font-family="Consolas, monospace" font-size="10.5" fill="#d4d4d4">  -6.1201 106.1503</text>
  </g>
  <g stroke="#9ca3af" stroke-width="2" marker-end="url(#ar)"><line x1="260" y1="216" x2="380" y2="216"/><line x1="580" y1="216" x2="672" y2="216"/></g>
</svg>
